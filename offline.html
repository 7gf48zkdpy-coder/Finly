<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finly</title>
<meta name="theme-color" content="#0B0A08">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0A08;color:#F4EFE4;font:16px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px}
  img{width:88px;height:88px;border-radius:20px}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#A8A096;line-height:1.5}
  button{margin-top:6px;height:48px;padding:0 24px;border:0;border-radius:24px;background:#E9B949;color:#0B0A08;font-size:16px;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <img src="apple-touch-icon.png" alt="">
    <h1>Pas de connexion</h1>
    <p>Finly a besoin d'Internet pour s'ouvrir. Vérifie ton Wi-Fi ou tes données mobiles, puis réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
